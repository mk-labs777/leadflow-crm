{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="ページ切り替え">{% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}">前へ</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }} ページ</span>{% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}">次へ</a>{% endif %}</nav>{% endif %}
