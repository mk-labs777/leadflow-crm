[project]
name = "leadflow-crm"
version = "0.1.0"
description = "自主制作デモ / 架空データ — Japanese renovation CRM"
requires-python = ">=3.13,<3.14"
dependencies = ["Django==6.1.3", "psycopg[binary]==3.3.2", "gunicorn==23.0.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-django==4.12.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
